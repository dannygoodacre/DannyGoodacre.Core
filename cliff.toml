[changelog]
header = """
# Changelog

All packages are released together at the same version.

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description %}. {{ commit.breaking_description | replace(from="\n", to=" ") | upper_first }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "Breaking" },
  { message = "^feat", group = "Added" },
  { message = "^(fix|perf|refactor)", group = "Changed" },
  { message = "^(docs|ci|chore|test|build)", skip = true },
]
